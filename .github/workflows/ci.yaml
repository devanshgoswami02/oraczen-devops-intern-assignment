name: CI

on:
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: notes-api

jobs:
  python-checks:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r app/requirements.txt
          pip install --no-cache-dir ruff

      - name: Run ruff lint
        run: ruff check app/ --select E,F --ignore E501,F401

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: python-checks
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag from git SHA
        id: tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -f app/Dockerfile app

      - name: Save image as artifact
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -o /tmp/notes-api-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-api-image
          path: /tmp/notes-api-image.tar
          retention-days: 1

  trivy-image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: notes-api-image
          path: /tmp

      - name: Load image into Docker
        run: docker load -i /tmp/notes-api-image.tar

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: "${{ env.IMAGE_NAME }}:${{ needs.docker-build.outputs.image_tag }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  trivy-config-scan:
    name: Helm lint + Trivy config scan
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: Build Helm dependencies
        run: helm dependency build helm/notes-api

      - name: Helm lint
        run: helm lint helm/notes-api

      - name: Render manifests
        run: |
          mkdir -p rendered
          helm template notes-api helm/notes-api \
            -f helm/notes-api/values-dev.yaml \
            > rendered/manifests.yaml

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: rendered/
          severity: "HIGH,CRITICAL"
          exit-code: "1"