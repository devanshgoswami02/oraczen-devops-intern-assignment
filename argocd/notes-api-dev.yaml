apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-api-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/devanshgoswami02/oraczen-devops-intern-assignment.git
    targetRevision: main
    path: helm/notes-api
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
