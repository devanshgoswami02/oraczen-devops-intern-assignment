apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes-api.fullname" . }}
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: notes-api
    app.kubernetes.io/instance: {{ .Release.Name }}
